<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>황재유 | MyLink</title>
<style>
  :root { --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#6b6f76; --accent:#2f6f5e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         background:var(--bg); color:var(--ink); min-height:100vh;
         display:flex; justify-content:center; padding:56px 20px; }
  .wrap { width:100%; max-width:420px; text-align:center; }
  .avatar { width:96px; height:96px; border-radius:50%; background:var(--accent); color:#fff;
            font-size:36px; font-weight:700; display:flex; align-items:center; justify-content:center;
            margin:0 auto 16px; }
  h1 { font-size:24px; margin-bottom:6px; }
  .bio { color:var(--muted); font-size:15px; line-height:1.5; margin-bottom:28px; }
  .links { display:flex; flex-direction:column; gap:12px; }
  .links a { display:block; background:var(--card); color:var(--ink); text-decoration:none;
             padding:16px; border-radius:14px; font-weight:600; border:1px solid #e3e0d8;
             transition:transform .15s, border-color .15s; }
  .links a:hover { transform:translateY(-2px); border-color:var(--accent); }
  footer { margin-top:36px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <main class="wrap">
    <div class="avatar">재</div>
    <h1>황재유</h1>
    <p class="bio">한양대학교 3학년<br>식품 · 영양 · 품질관리에 관심이 많아요</p>
    <nav class="links">
      <a href="https://github.com/jaeyoo-netize" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.hanyang.ac.kr/" target="_blank" rel="noopener">한양대학교</a>
      <a href="#" target="_blank" rel="noopener">Instagram (링크 추가 예정)</a>
      <a href="#" target="_blank" rel="noopener">Blog / Notion (링크 추가 예정)</a>
    </nav>
    <footer>© 2026 황재유 · MyLink</footer>
  </main>
</body>
</html>
